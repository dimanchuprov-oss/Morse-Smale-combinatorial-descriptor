[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morse-lidar"
version = "0.2.0"
description = "Morse-Smale topology tools for LiDAR depth surfaces"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
signal = ["scipy>=1.10"]
topology = ["gudhi>=3.9"]
lidar = ["laspy>=2.5", "open3d>=0.18"]
plot = ["matplotlib>=3.7"]

[project.scripts]
morse-lidar = "morse_lidar.cli:main"
morse-lidar-compare = "morse_lidar.compare:main"
morse-lidar-watch = "morse_lidar.watch:main"
morse-lidar-experiment = "morse_lidar.experiment:main"
morse-lidar-face = "morse_lidar.face_cli:main"
morse-lidar-multiface = "morse_lidar.multiface_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
